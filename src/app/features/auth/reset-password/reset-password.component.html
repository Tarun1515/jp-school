<ui-auth-shell
  [title]="title()"
  [subtitle]="subtitle()"
  [step]="isInvite() ? undefined : 'Step 3 of 3'"
>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (formError(); as message) {
      <p class="auth__alert" role="alert">{{ message }}</p>
    }

    <ui-password-field
      label="New password"
      inputId="new-password"
      autocomplete="new-password"
      helper="At least 8 characters."
      formControlName="password"
      [error]="passwordError()"
      [showStrength]="true"
    />

    <ui-password-field
      label="Type it again"
      inputId="confirm-password"
      autocomplete="new-password"
      formControlName="confirm"
      [error]="confirmError()"
    />

    <button
      type="submit"
      class="btn btn--primary btn--block btn--lg"
      [class.btn--loading]="submitting()"
      [disabled]="submitting()"
    >
      {{ submitLabel() }}
    </button>
  </form>

  <div authFoot class="auth__foot">
    <a routerLink="/auth/login">Back to sign in</a>
  </div>
</ui-auth-shell>
