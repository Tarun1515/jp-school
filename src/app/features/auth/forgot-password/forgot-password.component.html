@if (sent()) {
  <ui-auth-shell
    title="Check your email"
    subtitle="If that address has an account, a reset link is on its way. The link works for 30 minutes."
    step="Step 2 of 3"
  >
    <p class="auth__notice">
      Sent to <strong class="text-mono">{{ sentTo() }}</strong>
    </p>

    <p class="text-helper">
      Nothing after a couple of minutes? Check your spam folder, or send it
      again — the newest link is the one that works.
    </p>

    <div class="stack-4">
      <button type="button" class="btn btn--block" (click)="sendAgain()">
        Send again
      </button>

      <a class="btn btn--ghost btn--block" routerLink="/auth/login">Back to sign in</a>
    </div>
  </ui-auth-shell>
} @else {
  <ui-auth-shell
    title="Reset your password"
    subtitle="Tell us the email on your account and we will send you a link."
    step="Step 1 of 3"
  >
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label class="field__label" for="email">
          Email
        </label>

        <input
          class="form-control"
          id="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          formControlName="email"
          [attr.aria-invalid]="!!emailError()"
          [attr.aria-describedby]="emailError() ? 'email-error' : null"
          aria-required="true"
          (input)="onInput()"
        />

        @if (emailError(); as message) {
          <p class="field__error" id="email-error">{{ message }}</p>
        }
      </div>

      <button
        type="submit"
        class="btn btn--primary btn--block btn--lg"
        [class.btn--loading]="submitting()"
        [disabled]="submitting()"
      >
        Send reset link
      </button>
    </form>

    <div authFoot class="auth__foot">
      Remembered it? <a routerLink="/auth/login">Back to sign in</a>
    </div>
  </ui-auth-shell>
}
